server {
    listen __PORT__;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Static assets cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Container & Render Health Check Probe
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Internal API Reverse Proxy (supports Docker internal network routing)
    # -------------------------------------------------------------------
    # Use Docker's embedded DNS resolver (127.0.0.11) so that the backend
    # hostname is resolved per-request rather than at Nginx parse time.
    # This prevents "host not found in upstream" when Nginx starts before
    # the backend container is registered in Docker DNS.
    # The upstream address is injected via __BACKEND_UPSTREAM__ at runtime
    # by docker-entrypoint.sh; defaults to "backend:8000" for local Docker.
    location /api/ {
        resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $backend_upstream __BACKEND_UPSTREAM__;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Client Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
